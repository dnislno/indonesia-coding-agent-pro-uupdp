<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>PDP Guard — Dashboard Lokal</title>
<style>
*{box-sizing:border-box}
body{font:13px/1.6 system-ui;color:var(--foreground);max-width:760px}
h2{font-size:16px;margin:0 0 4px}
p.sub{color:var(--muted-foreground);font-size:12px;margin:0 0 14px}
.card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--card)}
.card h3{font-size:13px;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--foreground)}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--foreground)}
pre{background:#00000022;border:1px solid var(--border);border-radius:8px;padding:8px;max-height:220px;overflow:auto;font-size:11.5px;white-space:pre-wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--border)}
.ok{color:#22c55e}.warn{color:#f59e0b}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid var(--border);padding:4px 6px;text-align:left}
</style></head><body>
<h2>PDP Guard — berjalan lokal</h2>
<p class="sub">Data pribadi ditokenisasi di mesin ini sebelum ke model. Tanpa API key pun jalan (mode lokal penuh).</p>

<div class="card"><h3>Status</h3><div id="status">memuat…</div>
<div class="row" style="margin-top:8px">
<button id="bStart" class="ghost">Start LLM lokal</button>
<button id="bStop" class="ghost">Stop LLM lokal</button>
</div></div>

<div class="card"><h3>Mode frontier (opsional)</h3>
<p class="sub">Kosongkan = 100% lokal. Isi = request steril diteruskan ke frontier USA.</p>
<div class="row">
<input id="inUrl" placeholder="https://api.openai.com/v1" size="28">
<input id="inKey" type="password" placeholder="API key frontier" size="24">
<button id="bSave">Simpan (restart proxy)</button>
</div></div>

<div class="card"><h3>Sesi + audit trail</h3><div id="sessions">memuat…</div>
<div class="row" style="margin:8px 0">
<select id="selSession"></select>
<button id="bAudit" class="ghost">Lihat audit</button>
<button id="bPurge" class="ghost">Purge sesi ini</button>
</div>
<pre id="audit">-</pre></div>

<script>
const $ = (id) => document.getElementById(id);
async function jget(p) { const r = await fetch(p); return r.json(); }
async function jpost(p, body) {
  const r = await fetch(p, { method: "POST", headers: {"content-type":"application/json"}, body: body ? JSON.stringify(body) : "{}" });
  return r.json();
}
async function refresh() {
  const s = await jget("/api/status");
  $("status").innerHTML =
    `Mode: <b>${s.mode}</b> → <code>${s.target}</code><br>` +
    `LLM lokal: <span class="${s.llamaRunning ? "ok" : "warn"}">${s.llamaRunning ? "jalan" : "mati"}</span>` +
    ` (binary: ${s.llamaBinary ? "ada" : "belum diunduh"})<br>` +
    `Frontier key: ${s.keySet ? "terisi" : "kosong (mode lokal)"}`;
  const rows = (s.sessions || []).map((x) =>
    `<tr><td><code>${x.id}</code></td><td>${x.tokens} token</td><td>${x.audits} audit</td></tr>`).join("");
  $("sessions").innerHTML = rows ? `<table>${rows}</table>` : "Belum ada sesi.";
  $("selSession").innerHTML = (s.sessions || []).map((x) => `<option>${x.id}</option>`).join("");
}
$("bStart").onclick = async () => { alert(JSON.stringify(await jpost("/api/llama/start"))); refresh(); };
$("bStop").onclick = async () => { await jpost("/api/llama/stop"); refresh(); };
$("bSave").onclick = async () => {
  const r = await jpost("/api/config", { upstreamUrl: $("inUrl").value.trim(), upstreamKey: $("inKey").value.trim() });
  alert(JSON.stringify(r));
};
$("bAudit").onclick = async () => {
  const sid = $("selSession").value;
  if (!sid) return;
  const r = await jget(`/api/audit?session=${encodeURIComponent(sid)}&n=20`);
  $("audit").textContent = r.lines.map((l) => JSON.stringify(l)).join("\n") || "(kosong)";
};
$("bPurge").onclick = async () => {
  const sid = $("selSession").value;
  if (!sid || !confirm(`Hapus vault + audit sesi ${sid}?`)) return;
  await jpost(`/api/purge?session=${encodeURIComponent(sid)}`);
  refresh();
};
refresh();
setInterval(refresh, 10000);
</script>
</body></html>
