name: pdp-sync-upstream

# Tarik main terbaru earendil-works/pi ke fork ini, tiap hari + manual.
# Gagal (konflik) = workflow merah, selesaikan manual. Jangan --force.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "pdp-sync-bot"
          git config user.email "pdp-sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/earendil-works/pi.git || true
          git fetch upstream main
          git checkout main
          git merge --no-edit upstream/main
          git push origin main
